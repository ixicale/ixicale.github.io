# -----------------------------------------------------------------------------
# Site settings
# Change the text of the page in _data/content.yml.
# Change contact links in _data/social.yml.
# -----------------------------------------------------------------------------
name: Isaias Xicale
title: Isaias Xicale | Sr Fullstack Developer
description: Software engineer focused on building products for the web with passion for design and technology.
url: https://ixicale.github.io
baseurl: ''
lang: en
locale: en_US
keywords: fullstack, web, python, xicale, isaias, ixicale, software, engineer, developer, javascript, golang, aws, latam

author:
  name: Isaias Xicale
  email: ixicaleescalante@gmail.com
  job_title: Senior Fullstack Developer

# Image for link previews (Open Graph / Twitter). 1200 x 630 px.
cover: /assets/images/og-cover.png
favicon: /assets/svg/dark_logo_icon.png

# Visitor counter (GoatCounter: no cookies, no personal data).
# 1. Make a free account at https://www.goatcounter.com/signup
# 2. Put your site code here. Example: code "ixicale" -> ixicale.goatcounter.com
# Leave it empty to turn the counter off. It only runs on the live site.
goatcounter: ''

sass:
  sass_dir: _sass
  style: compressed

# Build settings
markdown: kramdown

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - '*.gemspec'
  - README.md
  - node_modules
  - build
  - package.json
  - package-lock.json
  - LICENSE
  - local.sh
  - Dockerfile

keep_files:
  - CNAME
