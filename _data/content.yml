about:
  id: about
  eyebrow: About me
  title: Hi, I'm Xicale. Nice to meet you
  paragraphs:
    - Looking back on my journey, it's been a whirlwind of innovation and growth. From designing seamless deposit processes and robust banking APIs to engineering the backend of logistics platforms that ensured every package found its way.
    - There's something magical about merging tech with the joy of life's big moments, like helping couples plan their dream day entirely online. And who could forget the thrill of venturing into the world of IoT, where every line of code meant a new way to connect and control our digital environment?
    - Each project was a chapter, filled with challenges that pushed me to learn and grow, and triumphs that reminded me why I love what I do. It's been a journey of passion, curiosity, and relentless pursuit of innovation. Here's to the next chapter!

