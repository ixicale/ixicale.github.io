<button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme" title="Switch theme">
  <span class="icon theme-toggle-light" aria-hidden="true"><i class="fa-solid fa-sun"></i></span>
  <span class="icon theme-toggle-dark" aria-hidden="true"><i class="fa-solid fa-moon"></i></span>
</button>
